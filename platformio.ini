[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X
    https://github.com/DuPPadotnet/ArduinoDuPPaLib.git
build_flags =
    -DDEBUG
    -UNDEBUG
    ; Altitude/vario source select -- see Config.h for what this changes.
    ; Defined: barometric altitude comes from GPS's own GGA fix instead
    ; of the MS5611, useful for testing the rest of the flight logic
    ; while the MS5611 hardware fault is being tracked down. Comment
    ; this out (or delete the line) to switch back to the MS5611.
    -DALTITUDE_SOURCE_GPS
;    -DVARIOMETER_VERSION="0.0.1"
;    -DARDUINO_USB_CDC_ON_BOOT=1
;    -DARDUINO_USB_MODE=1
build_type = debug

debug_tool = esp-builtin
debug_init_break = tbreak setup
;upload_protocol = esp-prog
;upload_port = COM3
;debug_server =
;  $PLATFORMIO_CORE_DIR/packages/tool-openocd-esp32/bin/openocd
;  -f
;  $PLATFORMIO_CORE_DIR/packages/tool-openocd-esp32/share/openocd/scripts/board/esp32c3-builtin.cfg
