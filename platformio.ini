[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = partitions.csv
; WebUI's static pages (see src/web/) as real .css/.html files, so they get
; editor syntax highlighting instead of living inside a C++ raw string
; literal. Embedded straight into the firmware image at build time --
; each entry becomes a NUL-terminated blob linked in as
; _binary_<path-with-non-alnum-as-_>_start/_end symbols (see WebUI.cpp),
; not a runtime filesystem read, so there's no LittleFS dependency added.
board_build.embed_txtfiles =
    src/web/style.css
    src/web/vario.html
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X
    https://github.com/DuPPadotnet/ArduinoDuPPaLib.git
    ; NimBLE rather than the stock ESP32 Bluedroid BLE stack: Bluedroid's
    ; RAM footprint (routinely 50-100KB+ once a central connects) is a
    ; poor fit on top of what this app already uses; NimBLE covers the
    ; same GATT server role in a fraction of the RAM/flash.
    h2zero/NimBLE-Arduino@^1.4.1
    ricmoo/QRCode@^0.0.1
build_flags =
    -DDEBUG
    -UNDEBUG
    ; Altitude/vario source select -- see Config.h for what this changes.
    ; Defined: barometric altitude comes from the GPS's own GGA fix
    ; instead of the DPS310. A bench aid for exercising the flight logic
    ; without a working barometer -- GPS altitude is materially noisier
    ; and slower, so it must stay commented out for flight.
;    -DALTITUDE_SOURCE_GPS
;    -DVARIOMETER_VERSION="0.0.1"
;    -DARDUINO_USB_CDC_ON_BOOT=1
;    -DARDUINO_USB_MODE=1
build_type = debug
;build_type = release

debug_tool = esp-builtin
debug_init_break = tbreak setup
;upload_protocol = esp-prog
;upload_port = COM3
;debug_server =
;  $PLATFORMIO_CORE_DIR/packages/tool-openocd-esp32/bin/openocd
;  -f
;  $PLATFORMIO_CORE_DIR/packages/tool-openocd-esp32/share/openocd/scripts/board/esp32c3-builtin.cfg
